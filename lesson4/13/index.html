<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson4-13</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>お問い合わせフォーム</h1>
  <!-- action: 送信先, method: 送信方法 -->
  <form action="program.php" method="post">
    <dl>
      <!-- .form-item*5>dt+dd -->
      <div class="form-item">
        <dt>
          <label for="username">お名前</label>
        </dt>
        <dd>
          <input type="text" name="userName" id="username">
        </dd>
      </div>
      <div class="form-item">
        <dt>
          <label for="useremail">メールアドレス</label>
        </dt>
        <dd>
          <!-- input:email -->
          <input type="email" name="userEmail" id="useremail">
        </dd>
      </div>
      <div class="form-item">
        <dt>職業</dt>
        <dd>
          <!-- label*3>input:radio[name=job value=""] -->
          <label class="label-radio
          "><input type="radio" name="job" value="学生" checked>学生</label>
          <label class="label-radio
          "><input type="radio" name="job" value="会社員">会社員</label>
          <label class="label-radio
          "><input type="radio" name="job" value="その他">その他</label>
        </dd>
      </div>
      <div class="form-item">
        <dt></dt>
        <dd></dd>
      </div>
      <div class="form-item">
        <dt></dt>
        <dd></dd>
      </div>
    </dl>
  </form>

</body>

</html>
