<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid 補足</title>
  <link rel="stylesheet" href="css/grid.css">
</head>
<body>

  <h2>画面幅に応じて列数が変わる(auto-fitとminmax)</h2>
  <div class="grid-auto">
    <!-- .box*5{$} -->
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
  </div>

  <h2>
    セルをまたぐ配置(grid-column / grid-row)
  </h2>
  <div class="grid-span">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
  </div>

  <h2>ページレイアウト(grid-template-areas / grid-area)</h2>
  <div class="grid-layout">
    <div class="box area-header">ヘッダー</div>
    <div class="box area-navi">ナビ</div>
    <div class="box area-contents">メインコンテンツ</div>
    <div class="box area-sidebar">サイドバー</div>
    <div class="box area-footer">フッター</div>
  </div>
  
</body>
</html>
