  <h1>ホバーアニメーション</h1>

  <div class="circle">四角から丸に</div>
  <div class="scale">ホバーして1秒後にズームアップ</div>

  <h1>キーフレームアニメーション</h1>
  <p>サンプル１: 開始1秒で右下へ、次の1秒で右上へ。を３回繰り返す</p>
  <div class="sample1">ジグザグに動く</div>
  
  <p>サンプル2: 開始2秒で拡大しながら赤→青へ、次の2秒で縮小しながら青→緑へ。そのあとは逆再生。</p>
  <div class="sample2">ジグザグに動く</div>
  
  <p>サンプル3,4: ローディングアニメーション</p>
